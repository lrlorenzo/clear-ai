version: 1
disable_existing_loggers: False

formatters:
  default:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: default
    stream: ext://sys.stdout

  file:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: default
    filename: logs/app.log
    when: midnight
    interval: 1
    backupCount: 30
    encoding: utf8

root:
  level: DEBUG
  handlers:
    - console
    - file